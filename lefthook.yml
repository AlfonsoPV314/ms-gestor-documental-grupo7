pre-commit:
  parallel: true
  commands:
    formato:
      run: pnpm format:check
    lint:
      run: pnpm lint
    go:
      run: node scripts/formato-go.mjs
    secretos:
      run: gitleaks protect --staged --redact --no-banner
pre-push:
  parallel: true
  commands:
    tipos:
      run: pnpm typecheck
    web:
      run: pnpm test
    api:
      run: pnpm test:api
