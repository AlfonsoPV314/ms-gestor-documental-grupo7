name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: go1.26.11
  TRIVY_VERSION: v0.76.1
  GOVULNCHECK_VERSION: v1.9.0
  OASDIFF_VERSION: v1.35.0
  DOCKLE_VERSION: v0.4.15
jobs:
  calidad:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: prueba-ci-aislada
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:prueba-ci-aislada@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && go mod verify && test -z "$(gofmt -l .)" && go vet ./...
      - run: pnpm verify
      - run: pnpm generate && pnpm codegen && git diff --exit-code
      - name: Compatibilidad del contrato
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:contracts/openapi.yaml" 2>/dev/null; then
            git show "$BASE_SHA:contracts/openapi.yaml" > /tmp/base.yaml
            go run github.com/oasdiff/oasdiff@${OASDIFF_VERSION} breaking /tmp/base.yaml contracts/openapi.yaml --fail-on ERR
          else
            echo 'Primer contrato: se establece la línea base; no hay contrato previo que comparar.'
          fi
          if git rev-parse hito-1 >/dev/null 2>&1; then
            git show hito-1:contracts/openapi.yaml > /tmp/hito-1.yaml
            go run github.com/oasdiff/oasdiff@${OASDIFF_VERSION} breaking /tmp/hito-1.yaml contracts/openapi.yaml --fail-on ERR
          fi
      - run: pnpm test:e2e:api
      - run: pnpm test:mutacion
      - name: Prueba de navegador sobre Compose real
        run: |
          mkdir -p .secrets
          export SIGNING_KEY_FILE="$PWD/.secrets/firma.key"
          node scripts/go.mjs run ./cmd/claves
          sudo chgrp 65532 "$SIGNING_KEY_FILE"
          chmod 0640 "$SIGNING_KEY_FILE"
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          if ! docker compose up -d --build --wait; then
            docker compose logs --no-color --tail 50 backend migrate
            exit 1
          fi
          pnpm --filter @pingeso-civil/ms-gestor-documental-ui exec playwright install --with-deps chromium
          pnpm test:e2e:web
          node scripts/demo.mjs
          API_MOCKS=true docker compose up -d --wait backend frontend
          node scripts/demo.mjs --mocks
          API_MOCKS=false docker compose up -d --wait backend frontend
      - name: Integración JWT y JWKS del Grupo 6
        run: |
          git clone https://github.com/PINGESO-CIVIL/usuarios-roles.git .artifacts/usuarios-roles
          git -C .artifacts/usuarios-roles checkout --detach 2d5ecccfd0fd27415ffbd4d6dd017ed895d94fd1
          cmp contracts/externos/identidad.yaml .artifacts/usuarios-roles/contracts/openapi.yaml
          docker compose -f docker-compose.yaml -f compose.integracion.yaml up -d --build identidad-grupo6-db identidad-grupo6
          for intento in $(seq 1 30); do
            if curl --fail --silent http://localhost:5161/.well-known/jwks.json > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:5161/.well-known/jwks.json > /dev/null
          docker compose -f docker-compose.yaml -f compose.integracion.yaml up -d --wait backend frontend
          node scripts/demo.mjs --grupo6
      - name: Detener servicios de demostración
        if: always()
        env:
          POSTGRES_PASSWORD: cierre-ci-no-se-utiliza-para-conectar
        run: docker compose -f docker-compose.yaml -f compose.integracion.yaml stop
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: evidencia-pruebas
          include-hidden-files: true
          path: |
            .artifacts/mutacion.log
            .artifacts/demo-*.json
            apps/api/coverage.out
            apps/web/coverage/lcov.info
            apps/web/playwright-report
            apps/web/test-results
      - name: Validar configuración de SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo '::error::Configurar SONAR_TOKEN y SONAR_HOST_URL en el repositorio. La instancia debe ser accesible desde GitHub y admitir el tipo de análisis solicitado.'
            exit 1
          fi
      - name: SonarQube y Quality Gate obligatorios
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with: { args: '-Dsonar.qualitygate.wait=true' }
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  seguridad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - run: pnpm install --frozen-lockfile && pnpm audit --audit-level high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - run: cd apps/api && go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { recursive: true, failure-threshold: error }
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: .secrets,.artifacts,.tools,node_modules
          format: json
          output: trivy-repositorio.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: evidencia-seguridad
          path: trivy-repositorio.json
  imagen:
    needs: [calidad, seguridad]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f apps/api/Dockerfile --build-arg VERSION=${GITHUB_SHA::7} -t api:ci .
      - run: docker build -f apps/api/Dockerfile.migrate -t migrate:ci .
      - run: docker build -f apps/web/Dockerfile -t web:ci .
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          {
            version: '${{ env.TRIVY_VERSION }}',
            image-ref: 'api:ci',
            severity: 'HIGH,CRITICAL',
            ignore-unfixed: true,
            exit-code: '1',
          }
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          {
            version: '${{ env.TRIVY_VERSION }}',
            image-ref: 'web:ci',
            severity: 'HIGH,CRITICAL',
            ignore-unfixed: true,
            exit-code: '1',
          }
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          {
            version: '${{ env.TRIVY_VERSION }}',
            image-ref: 'migrate:ci',
            severity: 'HIGH,CRITICAL',
            ignore-unfixed: true,
            exit-code: '1',
          }
      - run: |
          for image in api:ci web:ci migrate:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock goodwithtech/dockle:${DOCKLE_VERSION} --exit-code 1 --exit-level warn "$image"
          done
      - name: SBOM de las imágenes del commit
        run: |
          mkdir -p .artifacts
          for image in api web migrate; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --quiet --format cyclonedx "$image:ci" > ".artifacts/sbom-$image.cdx.json"
          done
          printf '%s\n' "$GITHUB_SHA" > .artifacts/commit-imagenes.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: evidencia-imagenes
          include-hidden-files: true
          path: |
            .artifacts/sbom-*.cdx.json
            .artifacts/commit-imagenes.txt
