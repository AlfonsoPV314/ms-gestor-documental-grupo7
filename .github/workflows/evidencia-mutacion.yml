name: Evidencia roja de mutación
on: workflow_dispatch
permissions:
  contents: read
jobs:
  proteccion-retirada:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env: { POSTGRES_PASSWORD: prueba-ci-aislada }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:prueba-ci-aislada@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/api/go.mod }
      - name: Debe fallar al permitir documentos ajenos
        run: node scripts/mutacion.mjs --evidencia-roja
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with: { name: evidencia-roja, path: .artifacts/mutacion.log }
