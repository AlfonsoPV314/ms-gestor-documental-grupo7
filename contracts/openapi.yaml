components:
  schemas:
    Documento:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/Documento.json
          format: uri
          readOnly: true
          type: string
        clave_id:
          type: string
        creado_en:
          format: date-time
          type: string
        firma:
          type: string
        id:
          format: uuid
          type: string
        nombre:
          examples:
            - informe.pdf
          maxLength: 200
          minLength: 1
          type: string
        propietario:
          format: uuid
          type: string
        sha256:
          pattern: ^[a-f0-9]{64}$
          type: string
        tamano:
          format: int64
          maximum: 20971520
          minimum: 1
          type: integer
        tipo:
          examples:
            - application/pdf
          type: string
      required:
        - id
        - propietario
        - nombre
        - tipo
        - tamano
        - sha256
        - firma
        - clave_id
        - creado_en
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    SalidaListaBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/SalidaListaBody.json
          format: uri
          readOnly: true
          type: string
        documentos:
          items:
            $ref: "#/components/schemas/Documento"
          type:
            - array
            - "null"
      required:
        - documentos
      type: object
    SalidaVerificacionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/SalidaVerificacionBody.json
          format: uri
          readOnly: true
          type: string
        algoritmo:
          type: string
        clave_id:
          type: string
        valida:
          type: boolean
      required:
        - valida
        - algoritmo
        - clave_id
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
    sesion:
      in: cookie
      name: sesion
      type: apiKey
info:
  title: MS Gestor Documental — Grupo 7
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/documentos:
    get:
      operationId: listar-documentos
      parameters:
        - explode: false
          in: query
          name: limite
          schema:
            default: 20
            format: int32
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int32
            maximum: 100000
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalidaListaBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - sesion: []
        - bearer: []
      summary: Listar documentos propios
      tags:
        - Documentos
      x-permiso: documentos:leer
    post:
      operationId: cargar-documento
      requestBody:
        content:
          multipart/form-data:
            encoding:
              archivo:
                contentType: application/pdf,image/png,image/jpeg,text/plain
            schema:
              properties:
                archivo:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
              required:
                - archivo
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Documento"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - sesion: []
        - bearer: []
      summary: Cargar y firmar documento
      tags:
        - Documentos
      x-permiso: documentos:operar
  /api/v1/documentos/{id}:
    get:
      operationId: consultar-documento
      parameters:
        - example: 11111111-1111-4111-8111-111111111111
          in: path
          name: id
          required: true
          schema:
            examples:
              - 11111111-1111-4111-8111-111111111111
